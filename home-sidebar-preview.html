<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kanban2Code v2 Home Preview</title>
  <link rel="stylesheet" href="./home-sidebar-preview.css" />
</head>
<body>
  <main class="preview-shell">
    <section class="sidebar-home" aria-label="Kanban2Code v2 Home">
      <div class="background-orb orb-a"></div>
      <div class="background-orb orb-b"></div>

      <header class="hero">
        <div class="brand-chip">AI-native workflow</div>
        <div class="brand-lockup">
          <div class="brand-mark" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
          </div>
          <div class="brand-copy">
            <p class="eyebrow">Kanban2Code</p>
            <h1>v2 Home</h1>
          </div>
        </div>
        <p class="subtitle">
          Your focused control surface for planning, context, and execution inside VS Code.
        </p>
      </header>

      <section class="action-grid" aria-label="Primary actions">
        <button class="action-card action-card-featured" type="button">
          <span class="action-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" role="presentation">
              <path d="M7 7.5A3.5 3.5 0 0 1 10.5 4h3A3.5 3.5 0 0 1 17 7.5V9h1a2 2 0 0 1 2 2v4a5 5 0 0 1-5 5h-6a5 5 0 0 1-5-5v-4a2 2 0 0 1 2-2h1V7.5Zm2 1.5h6V7.5A1.5 1.5 0 0 0 13.5 6h-3A1.5 1.5 0 0 0 9 7.5V9Zm3 3a2 2 0 1 0 0 4 2 2 0 0 0 0-4Z"/>
            </svg>
          </span>
          <span class="action-copy">
            <span class="action-label">Connect OpenClaw</span>
            <span class="action-meta">Bridge your workspace with live agent tooling.</span>
          </span>
        </button>

        <button class="action-card" type="button">
          <span class="action-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" role="presentation">
              <path d="M6 5h12a3 3 0 0 1 3 3v6a3 3 0 0 1-3 3h-4.2L9 20.5c-.7.5-1.7 0-1.7-.9V17H6a3 3 0 0 1-3-3V8a3 3 0 0 1 3-3Zm2.5 5.5h7m-7 3h4"/>
            </svg>
          </span>
          <span class="action-copy">
            <span class="action-label">Open Chat</span>
            <span class="action-meta">Jump straight into guided AI collaboration.</span>
          </span>
        </button>

        <button class="action-card" type="button">
          <span class="action-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" role="presentation">
              <path d="M5 5h6v14H5V5Zm8 0h6a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1h-6V5Zm2 3v2h2V8h-2Zm0 4v4h2v-4h-2Z"/>
            </svg>
          </span>
          <span class="action-copy">
            <span class="action-label">Open Sidebar</span>
            <span class="action-meta">Expand your workflow view with contextual tools.</span>
          </span>
        </button>

        <button class="action-card" type="button">
          <span class="action-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" role="presentation">
              <path d="M4 6a2 2 0 0 1 2-2h3v16H6a2 2 0 0 1-2-2V6Zm7-2h7a2 2 0 0 1 2 2v4h-9V4Zm0 8h9v6a2 2 0 0 1-2 2h-7v-8Zm2 2v2h5v-2h-5Z"/>
            </svg>
          </span>
          <span class="action-copy">
            <span class="action-label">Create Kanban</span>
            <span class="action-meta">Start a fresh board and turn intent into code.</span>
          </span>
        </button>
      </section>

      <section class="status-card" aria-label="Workspace status">
        <div class="status-header">
          <p>Workspace readiness</p>
          <span class="status-pill">Ready</span>
        </div>
        <p class="status-body">
          Connect services, open your working context, or create a board to begin orchestrating tasks.
        </p>
      </section>
    </section>
  </main>
</body>
</html>
