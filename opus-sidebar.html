<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kanban2Code v2 — Sidebar</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-base: #1a1a2e;
    --bg-surface: #16213e;
    --bg-card: rgba(255,255,255,0.04);
    --bg-card-hover: rgba(255,255,255,0.07);
    --bg-card-active: rgba(255,255,255,0.03);
    --border-card: rgba(255,255,255,0.06);
    --border-card-hover: rgba(255,255,255,0.12);
    --text-primary: #e8eaed;
    --text-secondary: rgba(255,255,255,0.5);
    --text-tertiary: rgba(255,255,255,0.3);
    --accent: #6c63ff;
    --accent-glow: rgba(108,99,255,0.15);
    --accent-subtle: rgba(108,99,255,0.08);
    --green: #34d399;
    --cyan: #22d3ee;
    --amber: #fbbf24;
    --rose: #f472b6;
    --radius: 14px;
    --radius-sm: 10px;
  }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg-base);
    color: var(--text-primary);
    width: 100%;
    max-width: 320px;
    min-height: 100vh;
    margin: 0 auto;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* Ambient background glow */
  body::before {
    content: '';
    position: fixed;
    top: -40%;
    left: -20%;
    width: 140%;
    height: 80%;
    background: radial-gradient(ellipse at 50% 50%, rgba(108,99,255,0.06) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .sidebar {
    position: relative;
    z-index: 1;
    padding: 28px 16px 24px;
    display: flex;
    flex-direction: column;
    gap: 28px;
    min-height: 100vh;
  }

  /* ── Header ── */
  .header {
    text-align: center;
    padding: 0 4px;
  }

  .logo-mark {
    width: 40px;
    height: 40px;
    margin: 0 auto 14px;
    background: linear-gradient(135deg, var(--accent) 0%, #8b5cf6 100%);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 20px rgba(108,99,255,0.25), 0 0 0 1px rgba(255,255,255,0.06);
    position: relative;
  }

  .logo-mark::after {
    content: '';
    position: absolute;
    inset: -1px;
    border-radius: 13px;
    background: linear-gradient(135deg, rgba(255,255,255,0.15), transparent 60%);
    mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    mask-composite: exclude;
    -webkit-mask-composite: xor;
    padding: 1px;
    pointer-events: none;
  }

  .logo-mark svg {
    width: 22px;
    height: 22px;
    color: #fff;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,0.2));
  }

  .brand-name {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -0.3px;
    color: var(--text-primary);
    line-height: 1.2;
  }

  .brand-version {
    display: inline-block;
    font-size: 10px;
    font-weight: 600;
    color: var(--accent);
    background: var(--accent-subtle);
    padding: 2px 7px;
    border-radius: 6px;
    margin-left: 6px;
    vertical-align: middle;
    letter-spacing: 0.3px;
    position: relative;
    top: -1px;
  }

  .brand-subtitle {
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 6px;
    font-weight: 400;
    letter-spacing: 0.1px;
    line-height: 1.4;
  }

  /* ── Actions ── */
  .actions {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .action-card {
    position: relative;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    background: var(--bg-card);
    border: 1px solid var(--border-card);
    border-radius: var(--radius);
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.22, 1, 0.36, 1);
    text-decoration: none;
    color: inherit;
    user-select: none;
    -webkit-user-select: none;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }

  .action-card::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: var(--radius);
    background: linear-gradient(135deg, rgba(255,255,255,0.03) 0%, transparent 50%);
    pointer-events: none;
  }

  .action-card:hover {
    background: var(--bg-card-hover);
    border-color: var(--border-card-hover);
    transform: translateY(-1px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.2), 0 0 0 1px rgba(255,255,255,0.04);
  }

  .action-card:active {
    background: var(--bg-card-active);
    transform: translateY(0.5px);
    box-shadow: none;
    transition-duration: 0.06s;
  }

  .action-icon {
    width: 38px;
    height: 38px;
    border-radius: var(--radius-sm);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    position: relative;
  }

  .action-icon svg {
    width: 18px;
    height: 18px;
    position: relative;
    z-index: 1;
  }

  .action-icon--connect {
    background: rgba(108,99,255,0.12);
    color: var(--accent);
    box-shadow: 0 0 12px rgba(108,99,255,0.08);
  }
  .action-icon--chat {
    background: rgba(34,211,238,0.1);
    color: var(--cyan);
    box-shadow: 0 0 12px rgba(34,211,238,0.06);
  }
  .action-icon--sidebar {
    background: rgba(52,211,153,0.1);
    color: var(--green);
    box-shadow: 0 0 12px rgba(52,211,153,0.06);
  }
  .action-icon--kanban {
    background: rgba(251,191,36,0.1);
    color: var(--amber);
    box-shadow: 0 0 12px rgba(251,191,36,0.06);
  }

  .action-content {
    flex: 1;
    min-width: 0;
  }

  .action-label {
    font-size: 13.5px;
    font-weight: 600;
    letter-spacing: -0.1px;
    line-height: 1.2;
    color: var(--text-primary);
  }

  .action-desc {
    font-size: 11.5px;
    color: var(--text-secondary);
    margin-top: 3px;
    line-height: 1.35;
    font-weight: 400;
  }

  .action-arrow {
    flex-shrink: 0;
    width: 16px;
    height: 16px;
    color: var(--text-tertiary);
    transition: transform 0.2s ease, color 0.2s ease;
  }

  .action-card:hover .action-arrow {
    color: var(--text-secondary);
    transform: translateX(2px);
  }

  /* ── Status strip ── */
  .status-strip {
    margin-top: auto;
    padding: 14px 16px;
    background: var(--bg-card);
    border: 1px solid var(--border-card);
    border-radius: var(--radius);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }

  .status-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .status-title {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.6px;
  }

  .status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 8px rgba(52,211,153,0.4);
    animation: pulse 2.5s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .status-rows {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .status-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .status-row-label {
    font-size: 11.5px;
    color: var(--text-secondary);
    font-weight: 400;
  }

  .status-row-value {
    font-size: 11.5px;
    color: var(--text-primary);
    font-weight: 500;
  }

  .status-row-value--accent {
    color: var(--accent);
  }

  /* ── Divider ── */
  .section-divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.06), transparent);
    margin: 0 20px;
  }
</style>
</head>
<body>
<div class="sidebar">

  <!-- Header -->
  <header class="header">
    <div class="logo-mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="7" height="9" rx="1.5"/>
        <rect x="14" y="3" width="7" height="5" rx="1.5"/>
        <rect x="14" y="12" width="7" height="9" rx="1.5"/>
        <rect x="3" y="16" width="7" height="5" rx="1.5"/>
      </svg>
    </div>
    <div class="brand-name">Kanban2Code<span class="brand-version">v2</span></div>
    <div class="brand-subtitle">AI-native project orchestration</div>
  </header>

  <div class="section-divider"></div>

  <!-- Primary Actions -->
  <nav class="actions">

    <a class="action-card" href="#connect">
      <div class="action-icon action-icon--connect">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
          <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
        </svg>
      </div>
      <div class="action-content">
        <div class="action-label">Connect OpenClaw</div>
        <div class="action-desc">Link your orchestration backend</div>
      </div>
      <svg class="action-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
    </a>

    <a class="action-card" href="#chat">
      <div class="action-icon action-icon--chat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
      </div>
      <div class="action-content">
        <div class="action-label">Open Chat</div>
        <div class="action-desc">Talk to your AI agents</div>
      </div>
      <svg class="action-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
    </a>

    <a class="action-card" href="#sidebar">
      <div class="action-icon action-icon--sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <line x1="9" y1="3" x2="9" y2="21"/>
        </svg>
      </div>
      <div class="action-content">
        <div class="action-label">Open Sidebar</div>
        <div class="action-desc">Project context at a glance</div>
      </div>
      <svg class="action-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
    </a>

    <a class="action-card" href="#kanban">
      <div class="action-icon action-icon--kanban">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <line x1="9" y1="3" x2="9" y2="21"/>
          <line x1="15" y1="3" x2="15" y2="13"/>
        </svg>
      </div>
      <div class="action-content">
        <div class="action-label">Create Kanban</div>
        <div class="action-desc">Start a new board from code</div>
      </div>
      <svg class="action-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
    </a>

  </nav>

  <!-- Status Strip -->
  <div class="status-strip">
    <div class="status-header">
      <span class="status-title">Status</span>
      <span class="status-dot"></span>
    </div>
    <div class="status-rows">
      <div class="status-row">
        <span class="status-row-label">Workspace</span>
        <span class="status-row-value">kanban2code</span>
      </div>
      <div class="status-row">
        <span class="status-row-label">Agents</span>
        <span class="status-row-value status-row-value--accent">3 ready</span>
      </div>
    </div>
  </div>

</div>
</body>
</html>
