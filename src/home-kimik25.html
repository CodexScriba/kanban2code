<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kanban2Code v2 - Home</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #0a0a0c;
      --bg-secondary: #111114;
      --bg-card: #16161a;
      --bg-card-hover: #1e1e24;
      --bg-card-active: #1a1a20;
      
      --border-subtle: rgba(255, 255, 255, 0.05);
      --border-highlight: rgba(255, 255, 255, 0.1);
      
      --text-primary: #f0f0f5;
      --text-secondary: #9a9aa4;
      --text-muted: #5a5a64;
      
      --accent-primary: #7c3aed;
      --accent-secondary: #06b6d4;
      --accent-glow: rgba(124, 58, 237, 0.35);
      --accent-cyan-glow: rgba(6, 182, 212, 0.3);
      
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.35);
      --shadow-md: 0 4px 20px rgba(0, 0, 0, 0.45);
      --shadow-lg: 0 8px 40px rgba(0, 0, 0, 0.55);
      --shadow-glow: 0 0 30px rgba(124, 58, 237, 0.12);
      
      --radius-sm: 10px;
      --radius-md: 14px;
      --radius-lg: 18px;
      
      --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
      --transition-smooth: 280ms cubic-bezier(0.4, 0, 0.2, 1);
      --transition-spring: 400ms cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', system-ui, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .sidebar-container {
      width: 100%;
      max-width: 300px;
      margin: 0 auto;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 28px;
      min-height: 100vh;
    }

    /* Ambient background glow */
    .ambient-glow {
      position: fixed;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(ellipse at 30% 20%, rgba(124, 58, 237, 0.08) 0%, transparent 50%),
                  radial-gradient(ellipse at 70% 80%, rgba(6, 182, 212, 0.06) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    /* Header Section */
    .header {
      display: flex;
      flex-direction: column;
      gap: 8px;
      position: relative;
      z-index: 1;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--accent-primary) 0%, var(--accent-secondary) 100%);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px var(--accent-glow), 0 0 0 1px rgba(255, 255, 255, 0.1) inset;
      position: relative;
      overflow: hidden;
    }

    .brand-logo::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 50%;
      background: linear-gradient(180deg, rgba(255,255,255,0.2) 0%, transparent 100%);
      border-radius: var(--radius-sm) var(--radius-sm) 0 0;
    }

    .brand-logo svg {
      width: 20px;
      height: 20px;
      color: white;
      position: relative;
      z-index: 1;
    }

    .brand-text {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .brand-name {
      font-size: 16px;
      font-weight: 650;
      letter-spacing: -0.02em;
      color: var(--text-primary);
    }

    .brand-version {
      font-size: 11px;
      color: var(--accent-secondary);
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .subtitle {
      font-size: 12px;
      color: var(--text-secondary);
      font-weight: 400;
      margin-left: 48px;
      margin-top: -4px;
    }

    /* Action Cards Section */
    .actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      position: relative;
      z-index: 1;
    }

    .action-card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: all var(--transition-smooth);
      position: relative;
      overflow: hidden;
    }

    .action-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.04) 0%, transparent 60%);
      opacity: 0;
      transition: opacity var(--transition-fast);
      pointer-events: none;
    }

    .action-card::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
      opacity: 0;
      transition: opacity var(--transition-fast);
    }

    .action-card:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-highlight);
      transform: translateY(-3px);
      box-shadow: var(--shadow-md), var(--shadow-glow);
    }

    .action-card:hover::before,
    .action-card:hover::after {
      opacity: 1;
    }

    .action-card:active {
      background: var(--bg-card-active);
      transform: translateY(-1px);
      box-shadow: var(--shadow-sm);
      transition-duration: 100ms;
    }

    .action-card.featured {
      background: linear-gradient(145deg, rgba(124, 58, 237, 0.12) 0%, var(--bg-card) 60%);
      border-color: rgba(124, 58, 237, 0.25);
    }

    .action-card.featured:hover {
      background: linear-gradient(145deg, rgba(124, 58, 237, 0.2) 0%, var(--bg-card-hover) 60%);
      border-color: rgba(124, 58, 237, 0.5);
      box-shadow: var(--shadow-md), 0 0 40px rgba(124, 58, 237, 0.2);
    }

    .action-icon {
      width: 42px;
      height: 42px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all var(--transition-smooth);
      position: relative;
    }

    .action-icon::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, transparent 100%);
      opacity: 0;
      transition: opacity var(--transition-fast);
    }

    .action-card:hover .action-icon::before {
      opacity: 1;
    }

    .action-icon svg {
      width: 22px;
      height: 22px;
      transition: transform var(--transition-smooth);
    }

    .action-card .action-icon {
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-secondary);
    }

    .action-card:hover .action-icon {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-primary);
    }

    .action-card:hover .action-icon svg {
      transform: scale(1.08);
    }

    .action-card.featured .action-icon {
      background: rgba(124, 58, 237, 0.15);
      color: #a78bfa;
    }

    .action-card.featured:hover .action-icon {
      background: rgba(124, 58, 237, 0.25);
      color: #c4b5fd;
    }

    .action-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
    }

    .action-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: -0.01em;
    }

    .action-description {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 400;
    }

    .action-arrow {
      width: 18px;
      height: 18px;
      color: var(--text-muted);
      flex-shrink: 0;
      opacity: 0;
      transform: translateX(-6px);
      transition: all var(--transition-fast);
    }

    .action-card:hover .action-arrow {
      opacity: 1;
      transform: translateX(0);
      color: var(--text-secondary);
    }

    /* Status Section */
    .status-section {
      margin-top: auto;
      padding-top: 20px;
      position: relative;
      z-index: 1;
    }

    .status-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      background: rgba(6, 182, 212, 0.06);
      border: 1px solid rgba(6, 182, 212, 0.12);
      border-radius: var(--radius-md);
      transition: all var(--transition-smooth);
    }

    .status-card:hover {
      background: rgba(6, 182, 212, 0.1);
      border-color: rgba(6, 182, 212, 0.2);
    }

    .status-indicator {
      width: 10px;
      height: 10px;
      background: var(--accent-secondary);
      border-radius: 50%;
      box-shadow: 0 0 16px var(--accent-cyan-glow);
      position: relative;
    }

    .status-indicator::after {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      border: 1px solid var(--accent-secondary);
      opacity: 0.4;
      animation: ripple 2s ease-out infinite;
    }

    @keyframes ripple {
      0% { transform: scale(1); opacity: 0.4; }
      100% { transform: scale(2.5); opacity: 0; }
    }

    .status-text {
      font-size: 12px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .status-text strong {
      color: var(--accent-secondary);
      font-weight: 600;
    }

    /* Divider */
    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--border-subtle), transparent);
      margin: 4px 0;
    }
  </style>
</head>
<body>
  <div class="ambient-glow"></div>
  
  <div class="sidebar-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="brand-logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7" rx="2"/>
            <rect x="14" y="3" width="7" height="7" rx="2"/>

    <div class="divider"></div>

    <!-- Primary Actions -->

            <path d="M12 2L2 7l10 5 10-5-10-5z"/>

            <path d="M2 12l10 5 10-5"/>

        </div>
        <div class="action-content">
          <span class="action-title">Connect OpenClaw</span>
          <span class="action-description">Link your AI assistant</span>
        </div>
        <svg class="action-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18l6-6-6-6"/>
        </svg>

      <!-- Open Chat -->
      <div class="action-card">
        <div class="action-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>
          </svg>
        </div>
        <div class="action-content">
          <span class="action-title">Open Chat</span>
          <span class="action-description">Start a conversation</span>
        </div>
        <svg class="action-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18l6-6-6-6"/>
        </svg>
      </div>

      <!-- Open Sidebar -->
      <div class="action-card">
        <div class="action-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <path d="M9 3v18"/>
            <path d="M9 9h8"/>
            <path d="M9 15h8"/>
          </svg>
        </div>
        <div class="action-content">
          <span class="action-title">Open Sidebar</span>
          <span class="action-description">View project panels</span>
        </div>
        <svg class="action-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18l6-6-6-6"/>
        </svg>
      </div>

      <!-- Create Kanban -->
      <div class="action-card">
        <div class="action-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <path d="M12 8v8"/>
            <path d="M8 12h8"/>
          </svg>
        </div>
        <div class="action-content">
          <span class="action-title">Create Kanban</span>
          <span class="action-description">New project board</span>
        </div>
        <svg class="action-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18l6-6-6-6"/>
        </svg>
      </div>
    </div>

    <!-- Status Section -->
    <div class="status-section">
      <div class="status-card">
        <div class="status-indicator"></div>
        <span class="status-text"><strong>Ready</strong> — 3 active tasks</span>
      </div>
    </div>
  </div>
</body>
</html>
